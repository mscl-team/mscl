[package]
name = "mscl-installer"
version = "0.1.0"
description = "MSCL 月之海启动器 安装程序"
authors = ["MSCL Team"]
edition = "2021"
rust-version = "1.77.2"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
