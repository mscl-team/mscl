<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSCL · 月之海启动器</title>
    <style>
      /* 启动画面内联：首帧即可见，不依赖 CSS/JS 加载，消除白屏 */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          120% 90% at 50% 32%,
          #1d2b4d 0%,
          #16213e 48%,
          #0f1830 100%
        );
        transition:
          opacity 0.48s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.48s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash.is-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .splash-moon {
        width: 66px;
        height: 66px;
        filter: drop-shadow(0 0 22px rgba(150, 180, 255, 0.35));
        animation: splash-float 2.4s ease-in-out infinite;
      }
      .splash-title {
        margin-top: 16px;
        font-size: 20px;
        letter-spacing: 6px;
        color: #eaf0ff;
        font-weight: 600;
        font-family:
          "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      }
      .splash-sub {
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 3px;
        color: #7d8fb8;
        font-family:
          "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      }
      .splash-bar {
        margin-top: 22px;
        width: 136px;
        height: 3px;
        border-radius: 99px;
        background: rgba(120, 145, 190, 0.22);
        overflow: hidden;
      }
      .splash-bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #5f7fc4, #cfdcff);
        animation: splash-run 1.2s ease-in-out infinite;
      }
      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes splash-run {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-moon,
        .splash-bar span {
          animation: none;
        }
      }
    </style>
    <script>
      // 首帧主题恢复：避免 React 挂载前出现白屏/变量缺失。
      (function () {
        try {
          var t = localStorage.getItem("mscl-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <svg class="splash-moon" viewBox="0 0 64 64" aria-hidden="true">
          <path
            d="M42.5 4.2a28 28 0 1 0 0 55.6 22 22 0 1 1 0-55.6Z"
            fill="#eaf0ff"
          />
        </svg>
        <div class="splash-title">MSCL</div>
        <div class="splash-sub">月之海启动器</div>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
